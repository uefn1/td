name: Torrent to Release

on:
  workflow_dispatch:
    inputs:
      torrent:
        description: 'magnetリンク または .torrentファイルのURL'
        required: true
        type: string
      tag:
        description: '作成するReleaseタグ (例: data-v1)'
        required: true
        type: string
      zip_name:
        description: '元になるzip名'
        default: 'content.zip'
        type: string

jobs:
  torrent-to-release:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      # ─────────────────────────────────────────────
      # 1. ディスク確保
      # ─────────────────────────────────────────────
      - name: Free disk space (action)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Free disk space (manual cleanup)
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          sudo apt-get clean
          sudo rm -rf /tmp/* /var/tmp/* || true
          echo "=== after ==="
          df -h /

      # ─────────────────────────────────────────────
      # 2. gh 用に .git のみ checkout
      # ─────────────────────────────────────────────
      - name: Checkout (git metadata only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: .
          persist-credentials: false

      - name: Verify git metadata
        run: |
          ls -la .git >/dev/null && echo ".git OK"
          git remote -v

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip

      # ─────────────────────────────────────────────
      # 3. ダウンロード
      # ─────────────────────────────────────────────
      - name: Download torrent
        env:
          INPUT: ${{ inputs.torrent }}
        run: |
          set -euo pipefail
          mkdir -p download
          if [[ "$INPUT" == magnet:* ]]; then
            echo "magnet link detected"
            aria2c --seed-time=0 --bt-stop-timeout=1800 \
              --bt-enable-lpd=false \
              --max-connection-per-server=16 \
              --allow-overwrite=true \
              -d ./download "$INPUT"
          else
            echo "assume .torrent URL"
            curl -fL --connect-timeout 30 --max-time 300 -o meta.torrent "$INPUT"
            aria2c --seed-time=0 --bt-stop-timeout=1800 \
              --bt-enable-lpd=false \
              -d ./download meta.torrent
          fi

          echo "--- downloaded ---"
          du -sh download
          df -h /

      # ─────────────────────────────────────────────
      # 4. 戦略決定: フラット かつ 合計 ≤ 1900MiB → raw、それ以外 → zip
      # ─────────────────────────────────────────────
      - name: Decide strategy (raw or zip)
        run: |
          set -euo pipefail
          MAX_BYTES=$((1900 * 1024 * 1024))      # 1,992,294,400
          TOTAL=$(du -sb download | awk '{print $1}')
          FILE_COUNT=$(find download -type f | wc -l)
          DIR_COUNT=$(find download -mindepth 1 -type d | wc -l)
          echo "files: ${FILE_COUNT}, dirs: ${DIR_COUNT}, total: ${TOTAL} bytes (threshold: ${MAX_BYTES})"

          if (( FILE_COUNT == 0 )); then
            echo "ERROR: no files downloaded"
            exit 1
          fi

          if (( TOTAL <= MAX_BYTES )) && (( DIR_COUNT == 0 )); then
            echo "→ raw mode (flat & size <= 1900MiB, zip skipped)"
            echo "MODE=raw" >> "$GITHUB_ENV"
            echo "PART_COUNT=${FILE_COUNT}" >> "$GITHUB_ENV"
          else
            if (( DIR_COUNT > 0 )); then
              echo "→ zip mode (nested directories detected)"
            else
              echo "→ zip mode (size > 1900MiB)"
            fi
            echo "MODE=zip" >> "$GITHUB_ENV"
          fi

      # ─────────────────────────────────────────────
      # 5a. MODE=zip: zip → split → 元zip削除
      # ─────────────────────────────────────────────
      - name: Zip and split (MODE=zip)
        if: env.MODE == 'zip'
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          echo "=== disk before zip ==="
          df -h /

          ( cd download && zip -r -0 "../${ZIP_NAME}" . )
          rm -rf download
          rm -f meta.torrent

          split -b 1900M -d -a 4 "${ZIP_NAME}" "${ZIP_NAME}.part"
          rm -f "${ZIP_NAME}"

          echo "PART_COUNT=$(ls -1 "${ZIP_NAME}".part* | wc -l)" >> "$GITHUB_ENV"

          echo "=== final disk ==="
          df -h /
          ls -lh "${ZIP_NAME}".part*

      # ─────────────────────────────────────────────
      # 5b. MODE=raw: download/ をそのまま使う
      # ─────────────────────────────────────────────
      - name: Raw mode (MODE=raw)
        if: env.MODE == 'raw'
        run: |
          set -euo pipefail
          echo "=== raw mode: files to upload ==="
          find download -type f -printf '%s\t%p\n' | sort -k2
          du -sh download

      # ─────────────────────────────────────────────
      # 6. Draft Release 作成
      # ─────────────────────────────────────────────
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ZIP_NAME: ${{ inputs.zip_name }}
          SRC: ${{ inputs.torrent }}
          MODE: ${{ env.MODE }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == "zip" ]]; then
            TITLE="Release $TAG - ${PART_COUNT} parts"
            RESTORE="cat ${ZIP_NAME}.part* > ${ZIP_NAME} && unzip ${ZIP_NAME}"
          else
            TITLE="Release $TAG - ${PART_COUNT} raw files"
            RESTORE="download all ${PART_COUNT} assets individually"
          fi

          gh release create "$TAG" \
            --draft \
            --title "$TITLE" \
            --notes "Source: \`$SRC\`
          Restore: \`${RESTORE}\`"

      # ─────────────────────────────────────────────
      # 7. 逐次アップロード（3回リトライ）
      # ─────────────────────────────────────────────
      - name: Upload assets one by one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ZIP_NAME: ${{ inputs.zip_name }}
          MODE: ${{ env.MODE }}
        run: |
          set -euo pipefail

          if [[ "$MODE" == "zip" ]]; then
            mapfile -t FILES < <(ls -1 "${ZIP_NAME}".part*)
          else
            mapfile -d '' -t FILES < <(find download -type f -print0 | sort -z)
          fi

          for f in "${FILES[@]}"; do
            echo "▶ uploading $f ..."
            uploaded=0
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$f" --clobber; then
                uploaded=1
                break
              fi
              echo "retry $attempt for $f"
              sleep 10
            done
            if [[ $uploaded -ne 1 ]]; then
              echo "failed to upload $f"
              exit 1
            fi
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false
